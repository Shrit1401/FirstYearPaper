<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Paper preview</title>
<link rel="stylesheet" href="viewer.css"><script type="module" src="viewer.mjs"></script></head>
<body><nav aria-label="PDF controls"><button id="previous" aria-label="Previous page" disabled>←</button><label>Page <input id="page" type="number" min="1" value="1" aria-label="Page number" disabled></label><span id="count">of …</span><button id="next" aria-label="Next page" disabled>→</button><span class="spacer"></span><button id="smaller" aria-label="Zoom out" disabled>−</button><button id="fit" disabled>Fit width</button><button id="larger" aria-label="Zoom in" disabled>+</button></nav>
<p id="status" role="status">Loading paper…</p><main id="paper"><div id="sheet"><canvas id="canvas" role="img" aria-label="Question paper"></canvas></div></main>
</body></html>
